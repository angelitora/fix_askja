name: Update drifter report

on:
  schedule:
    # Every 3 hours, 30 minutes past the hour (matches the drifter's own
    # reporting cadence, offset slightly so new data has landed by the
    # time this runs).
    - cron: '5 */3 * * *'
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write   # needed to push the regenerated docs/ folder back

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install numpy pandas requests matplotlib cartopy scipy

      - name: Generate report
        env:
          DRIFTER_AUTH_USER: ${{ secrets.DRIFTER_AUTH_USER }}
          DRIFTER_AUTH_PASS: ${{ secrets.DRIFTER_AUTH_PASS }}
        run: python generate_report.py

      - name: Commit updated report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --quiet --cached || git commit -m "Update drifter report [skip ci]"
          git push
